output:
  format: grouped

filters:
  exclude: []

tagging:
  rules:
    - match: { remarks_equals: ["NL-WS"] }
      tag: nl-ws
    - match: { remarks_equals: ["NL-XHTTP"] }
      tag: nl-xhttp
    - match: { remarks_equals: ["NL-GRPC"] }
      tag: nl-grpc
    - match: { remarks_equals: ["US-WS"] }
      tag: us-ws
    - match: { remarks_equals: ["US-GRPC"] }
      tag: us-grpc
  default_template: "node-{index}"

balancers:
  - tag: global-pool
    remarks: "NL+USA Balance"
    strategy: roundRobin
    members:
      - tags: [nl-ws, us-ws]